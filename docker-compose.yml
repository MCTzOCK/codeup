version: "3"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    ports:
      - "8899:8899"
    env_file: ".env.web"
    user: "root"
    privileged: true
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - /etc/codeup/git:/etc/codeup/git
  graphql-server:
    build:
      context: .
      dockerfile: Dockerfile.graphql-server
    ports:
      - "4001:4000"
    env_file: ".env.gql"
    user: "root"
    privileged: true
    restart: unless-stopped
    networks:
      - gql
  observability:
    build:
        context: .
        dockerfile: Dockerfile.observability
    ports:
      - "4002:3000"
    env_file: ".env.observability"
    user: "root"
    restart: unless-stopped
    networks:
      - observability
networks:
  gql:
    driver: bridge
  observability:
    driver: bridge
