version: "3"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    ports:
      - "8899:8899"
    env_file: ".env.web"
    user: "root"
    privileged: true
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - /etc/codeup/git:/etc/codeup/git
